name: Scoring looks wrong
description: The MVP or the ranking does not match what you saw
labels: [scoring]
body:
  - type: textarea
    id: what
    attributes:
      label: Who ranked where, and what did you expect instead?
      description: Say which player looks too high or too low, and why.
    validations:
      required: true
  - type: textarea
    id: explain
    attributes:
      label: "/mvp explain output"
      description: Run it right after the key, before anything else resets the meter. Remove any character names you would rather not share.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Addon version
      description: Shown in the AddOns list on the character-select screen.
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Dungeon and key level
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Roles in the group, who died and why, anything the meter would not show.
